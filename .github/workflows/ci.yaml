name: ci

on:
  push:
    branches:
      - main
    tags:
      - v*.*.*
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  test-docker-version:
    strategy:
      fail-fast: false
      matrix:
        docker-version:
          - "18.03"
          - "18.09"
          - "19.03"
          - "20.10"
          - "23"
          - "24"
          - "25"
          - "26"
          - "27"
          - "28"
          - "29"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: docker pull --quiet 'docker:${{ matrix.docker-version }}'
      - run: go test -count=1 -v -run TestHelpOfDockerVersion ./...
        env:
          DOCKER_VERSION: ${{ matrix.docker-version }}

  ci:
    needs: test-docker-version
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write # for release
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - name: Build
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "build/$arch/docker.exe" ./cmd/docker
            (cd "build/$arch" && 7z a -bd "../../dist/docker-wsl-shim-windows-$arch.zip" docker.exe ../../LICENSE)
          done
      - if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          make_latest: true
          generate_release_notes: true
          files: dist/*.zip
